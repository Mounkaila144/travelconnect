name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: travelconnect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysql, gd, intl, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: travelconnect-api
        run: composer install --no-progress --prefer-dist

      - name: Copy environment file
        working-directory: travelconnect-api
        run: cp .env.example .env

      - name: Generate application key
        working-directory: travelconnect-api
        run: php artisan key:generate

      - name: Run tests
        working-directory: travelconnect-api
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: travelconnect_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/travelconnect-api
            php artisan down --retry=60
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            sudo systemctl restart php8.2-fpm
            php artisan queue:restart 2>/dev/null || true
            php artisan up
            echo "Deployment completed at $(date)"

      - name: Health Check
        run: |
          sleep 10
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.SERVER_HOST }}/api/health || echo "000")
          if [ "$RESPONSE" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check returned: $RESPONSE"
            exit 1
          fi
